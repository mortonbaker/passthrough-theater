<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Passthrough Theater</title>
<style>
body{background:#0e0e0e;color:#eee;font:15px/1.5 system-ui,sans-serif;margin:0;padding:22px}
h1{font-size:19px;margin:0 0 4px}
p.sub{color:#888;margin:0 0 18px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:#1b1b1b;border-radius:10px;overflow:hidden;cursor:pointer}
.card:hover{background:#282828}
.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#000}
.card span{display:block;padding:9px 11px;font-size:13px}
#err{color:#f66;white-space:pre-wrap;margin-top:14px}
button{background:#2a6df4;color:#fff;border:0;border-radius:10px;padding:18px 34px;
  font-size:20px;cursor:pointer;margin:0 10px 0 0}
button.grey{background:#333}
/* display:flex beats the UA rule for [hidden], so the overlay must opt out
   explicitly or it covers the page permanently. */
[hidden]{display:none !important}
#stage{position:fixed;inset:0;background:rgba(8,8,10,.96);z-index:5;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center}
#stage img{width:260px;height:260px;object-fit:cover;border-radius:14px;background:#000;margin-bottom:18px}
#stage h2{font-size:22px;margin:0 0 6px;max-width:760px}
#stage p{color:#888;margin:0 0 22px}
#legend{margin-top:24px;color:#777;font-size:13px;line-height:1.9}
#legend b{color:#bbb}
canvas.gl{position:fixed;inset:0;z-index:-1}
</style>
</head>
<body>
<div id="lib">
  <h1>Passthrough Theater <span style="color:#555;font-weight:400">build __BUILD__</span></h1>
  <p class="sub">tap a video to enter passthrough &mdash; browsing, settings and voice are all in-headset</p>
  <div id="grid"></div>
  <p id="err"></p>
  <div id="legend">
    <b>Trigger</b> points and clicks &middot; away from a panel it hides/shows the bar,
    hold to re-aim it<br>
    <b>&#9776;</b> library &nbsp; <b>&#127908;</b> hands-free voice &nbsp;
    <b>&#9881;</b> advanced &nbsp; <b>A</b> play/pause &nbsp; <b>B</b> exit
  </div>
</div>
<div id="stage" hidden>
  <img id="sthumb" alt="">
  <h2 id="stitle"></h2>
  <p id="smeta"></p>
  <div>
    <button id="go">Enter VR</button>
    <button id="cancel" class="grey">Back</button>
  </div>
  <p id="sdiag" style="color:#777;font-size:13px;margin-top:16px"></p>
  <p id="err2" style="color:#f66"></p>
</div>

<script type="module">
import * as THREE from './three.module.js';

/* ============================ config ============================ */
const FOV = {fisheye190:190, fisheye:180, mkx200:200, mkx220:220, rf52:190, vrca220:220};
const $ = id => document.getElementById(id);
const clamp = THREE.MathUtils.clamp;
const rad = THREE.MathUtils.degToRad, deg = THREE.MathUtils.radToDeg;
const fmt = s => { s = Math.max(0, s|0); const h = (s/3600)|0, m = ((s%3600)/60)|0, x = s%60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`
           : `${m}:${String(x).padStart(2,'0')}`; };
const clock = () => new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});

// Ergonomics, from Meta's spatial guidelines: >=0.5m or eyes strain, 1.0-1.5m is
// the comfortable band, +-30deg horizontal / +20 up / -12 down before neck strain.
const UI = {
  barDist: 1.25, barWdeg: 44, barHdeg: 20, barPitch: -12,
  libDist: 1.7,  libWdeg: 56, libHdeg: 34, libPitch: -6,
  advDist: 1.35, advWdeg: 40, advHdeg: 36, advPitch: -4,
  scale: parseFloat(localStorage.getItem('uiScale') || '1'),
};
const C = {bg:'rgba(14,14,16,0.90)', bg2:'rgba(22,22,26,0.95)', line:'#2f2f36',
  txt:'#f0f0f2', dim:'#9a9aa4', accent:'#3d8bff', accent2:'#2a6df4',
  hover:'#3a3a44', ok:'#5ad07a', rec:'#ff5a5a'};

/* ============================ state ============================ */
let detail=null, vidId=null, video=null, renderer=null, scene=null, session=null, xrCam=null;
let mats=[], group=null, uiRoot=null, videoTex=null;
let yaw=0, pitch=0, roll=0, posY=0, dist=0, scl=1;
try { const f=JSON.parse(localStorage.getItem('framing')||'{}');
  yaw=f.yaw??0; pitch=f.pitch??0; roll=f.roll??0; posY=f.posY??0;
  dist=f.dist??0; scl=f.scl??1; } catch(e){}
let framingSaved=0;
let advMode = localStorage.getItem('advMode') === '1';
let screenMode = 'bar';                       // 'bar' | 'browse'
let menuOn = true;
let library=[], libFiltered=[], libPage=0, libQuery='';
const LIB_COLS=4, LIB_ROWS=3, LIB_PER=LIB_COLS*LIB_ROWS;
let videoVol = parseFloat(localStorage.getItem('videoVol') || '1');
let chatVol  = parseFloat(localStorage.getItem('chatVol')  || '1');
let saveNote='', noteUntil=0;
const prevBtn={left:{},right:{}};
let seekCool=0, grab=null;
const SID = 'vr-' + Math.floor(Math.random()*1e9);
const thumbs = {};                            // id -> Image

// No console in the headset. sendBeacon rather than fetch: the browser flushes
// beacons during page teardown, so a crash or reload still gets reported.
const _seenErr = new Set();
function beacon(msg){
  const u = '/clientlog?m=' + encodeURIComponent(String(msg).slice(0,700));
  try { if (navigator.sendBeacon && navigator.sendBeacon(u)) return; } catch(_){}
  try { fetch(u, {keepalive:true}); } catch(_){}
}
function step(s){ beacon('STEP ' + s); }
function report(tag, e){
  const msg = tag + ': ' + (e && (e.stack || e.message || e) || e);
  if (_seenErr.has(msg.slice(0,180))) return;
  _seenErr.add(msg.slice(0,180));
  beacon(msg);
}
window.addEventListener('error', ev => report('window.onerror', ev.error || ev.message));
window.addEventListener('unhandledrejection', ev => report('unhandled', ev.reason));
window.addEventListener('pagehide', () => beacon('PAGEHIDE session=' + (!!session)));

/* ============================ library ============================ */
async function loadLib(){
  const j = await (await fetch('/deovr')).json();
  library = j.scenes[0].list.map(it => ({
    id: it.video_url.split('/').pop(), title: it.title, videoLength: it.videoLength}));
  libApply();
  for (const it of library){
    const c = document.createElement('div');
    c.className='card';
    c.innerHTML = `<img loading="lazy" src="/thumb/${it.id}.jpg"><span>${it.title}</span>`;
    c.onclick = () => select(it.id);
    $('grid').appendChild(c);
  }
}
let libSort = localStorage.getItem('libSort') || 'title';
function libApply(){
  const q = libQuery.trim().toLowerCase();
  libFiltered = q ? library.filter(v => v.title.toLowerCase().includes(q)) : library.slice();
  if (libSort === 'title') libFiltered.sort((a,b)=>a.title.localeCompare(b.title));
  else if (libSort === 'long') libFiltered.sort((a,b)=>(b.videoLength||0)-(a.videoLength||0));
  else if (libSort === 'short') libFiltered.sort((a,b)=>(a.videoLength||0)-(b.videoLength||0));
  libPage = 0;
}
function thumbOf(id){
  if (thumbs[id]) return thumbs[id];
  const im = new Image();
  im.onload = () => { needDraw = true; };
  im.src = '/thumb/'+id+'.jpg';
  thumbs[id] = im;
  return im;
}

/* ============================ screen geometry ============================ */
function fisheyeGeo(fovDeg, R=8, seg=72){
  const tMax = rad(fovDeg/2), pos=[], uv=[], idx=[];
  for (let j=0;j<=seg;j++) for (let i=0;i<=seg;i++){
    const t=j/seg*tMax, p=i/seg*Math.PI*2, st=Math.sin(t), ct=Math.cos(t);
    pos.push(R*st*Math.cos(p), R*st*Math.sin(p), -R*ct);
    const r=(t/tMax)*0.5;
    uv.push(0.5+r*Math.cos(p), 0.5+r*Math.sin(p));
  }
  for (let j=0;j<seg;j++) for (let i=0;i<seg;i++){
    const a=j*(seg+1)+i, b=a+1, c=a+seg+1, d=c+1;
    idx.push(a,b,c, b,d,c);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx); return g;
}
function domeGeo(full){
  const g=new THREE.SphereGeometry(8,72,72, full?0:Math.PI/2, full?Math.PI*2:Math.PI);
  g.scale(-1,1,1); return g;
}

const FRAG = `
precision highp float; varying vec2 vUv;
uniform sampler2D map; uniform vec2 uvOff, uvScl, matteOff;
uniform float uvZoom;
uniform int useMatte, useKey; uniform vec3 keyColor;
uniform float similarity, smoothness, spill;
void main(){
  vec2 cuv = ((vUv - 0.5) / uvZoom + 0.5)*uvScl + uvOff;
  vec4 c = texture2D(map, cuv);
  float a = 1.0;
  if (useMatte==1) a = texture2D(map, cuv + matteOff).r;
  else if (useKey==1){
    float d = distance(c.rgb, keyColor);
    a = smoothstep(similarity, similarity+smoothness, d);
    if (spill>0.5){ float g=max(c.r,c.b); c.g = min(c.g, g + (c.g-g)*0.2); }
  }
  if (a < 0.01) discard;
  gl_FragColor = vec4(c.rgb, a);
}`;
const VERT = `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`;

const keyState = {color:'#000000', similarity:0.10, smoothness:0.08};
function makeMat(tex){
  return new THREE.ShaderMaterial({transparent:true, side:THREE.DoubleSide, depthWrite:false,
    uniforms:{ map:{value:tex},
      uvOff:{value:new THREE.Vector2()}, uvScl:{value:new THREE.Vector2(1,1)},
      matteOff:{value:new THREE.Vector2()}, useMatte:{value:0}, useKey:{value:1},
      uvZoom:{value:scl},
      keyColor:{value:new THREE.Color(keyState.color)},
      similarity:{value:keyState.similarity}, smoothness:{value:keyState.smoothness},
      spill:{value:0}},
    vertexShader:VERT, fragmentShader:FRAG});
}
function eyeUV(m, eye, sbs, matteTB){
  const sx=sbs?0.5:1, ox=(sbs&&eye===1)?0.5:0;
  if (matteTB){ m.uniforms.uvScl.value.set(sx,0.5); m.uniforms.uvOff.value.set(ox,0.5);
    m.uniforms.matteOff.value.set(0,-0.5); m.uniforms.useMatte.value=1; }
  else { m.uniforms.uvScl.value.set(sx,1); m.uniforms.uvOff.value.set(ox,0); }
}
function applyKey(){
  for (const m of mats){
    m.uniforms.keyColor.value.set(keyState.color);
    m.uniforms.similarity.value = keyState.similarity;
    m.uniforms.smoothness.value = keyState.smoothness;
    const c = new THREE.Color(keyState.color);
    m.uniforms.spill.value = (c.g > c.r*1.5 && c.g > c.b*1.5) ? 1 : 0;
  }
}
function applyTransform(){
  if (!group) return;
  group.rotation.order='YXZ';
  group.rotation.y=yaw+baseYaw; group.rotation.x=pitch; group.rotation.z=roll;
  group.position.y=posY; group.position.z=dist;
  group.scale.setScalar(1);            // a dome you sit inside cannot be zoomed by scale
  for (const m of mats) m.uniforms.uvZoom.value = scl;
  const now=performance.now();
  if (now-framingSaved > 600){ framingSaved=now;
    try { localStorage.setItem('framing', JSON.stringify({yaw,pitch,roll,posY,dist,scl})); } catch(e){} }
}

/* ============================ curved UI panels ============================ */
// Panels orbit the user at a fixed radius, so apparent size stays constant no
// matter where they are aimed (distance-independent sizing).
let panels = {}, needDraw = true;
function curvedGeo(wRad, hM, R, segX=64){
  const pos=[], uv=[], idx=[];
  for (let j=0;j<=1;j++) for (let i=0;i<=segX;i++){
    const u=i/segX, a=(u-0.5)*wRad;
    pos.push(R*Math.sin(a), (0.5-j)*hM, -R*Math.cos(a));
    uv.push(u, 1-j);
  }
  // Wind counter-clockwise as seen from the viewer at the centre of curvature,
  // otherwise every triangle is a back face: (b-a)x(c-a) pointed at -Z, away
  // from the eye, so the panels were culled entirely.
  for (let i=0;i<segX;i++){
    const a=i, b=i+1, c=i+segX+1, d=c+1;
    idx.push(a,c,b, b,c,d);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx); return g;
}
function makePanel(name, o){
  const s = UI.scale;
  const wRad = rad(o.wDeg*s), hM = o.dist * rad(o.hDeg*s);
  const cw = o.cw, ch = Math.round(cw * (hM / (o.dist*wRad)));
  const cv = document.createElement('canvas'); cv.width=cw; cv.height=ch;
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace; tex.minFilter = THREE.LinearFilter;
  const mesh = new THREE.Mesh(curvedGeo(wRad, hM, o.dist),
    new THREE.MeshBasicMaterial({map:tex, transparent:true, depthTest:false,
      depthWrite:false, side:THREE.DoubleSide}));   // raycasting honours side too
  mesh.renderOrder = o.order || 10;
  const holder = new THREE.Group();
  holder.rotation.order = 'YXZ';
  holder.rotation.x = rad(o.pitch || 0);
  holder.add(mesh);
  const p = {name, mesh, holder, cv, ctx:cv.getContext('2d'), tex,
             widgets:o.widgets || [], hover:null, draw:o.draw};
  panels[name] = p;
  return p;
}
function panelVisible(name, on){ if (panels[name]) panels[name].holder.visible = on; }

/* ---- canvas drawing helpers (sizes are canvas px; panels are angular) ---- */
function rr(c,x,y,w,h,r){ c.beginPath(); c.roundRect(x,y,w,h,r); }
function btn(c, w, label, opt={}){
  const on = opt.on, hov = opt.hover;
  c.fillStyle = on ? C.accent2 : (hov ? C.hover : '#26262c');
  rr(c, w.x, w.y, w.w, w.h, opt.radius ?? 14); c.fill();
  if (hov && !on){ c.strokeStyle = C.accent; c.lineWidth = 3; c.stroke(); }
  c.fillStyle = opt.muted ? C.dim : C.txt;
  c.font = (opt.font || '30px') + ' system-ui';
  c.textAlign='center'; c.textBaseline='middle';
  c.fillText(label, w.x+w.w/2, w.y+w.h/2+1);
  c.textAlign='left'; c.textBaseline='alphabetic';
}
function slider(c, w, frac, opt={}){
  const y = w.y + w.h/2, f = clamp(frac,0,1);
  c.fillStyle = '#33333c'; rr(c, w.x, y-7, w.w, 14, 7); c.fill();
  c.fillStyle = opt.hover ? C.accent : C.accent2; rr(c, w.x, y-7, Math.max(10, w.w*f), 14, 7); c.fill();
  c.fillStyle = opt.hover ? '#fff' : '#dcdce4';
  c.beginPath(); c.arc(w.x + w.w*f, y, opt.hover?20:16, 0, 7); c.fill();
  if (opt.label){ c.fillStyle=C.dim; c.font='26px system-ui'; c.textAlign='right';
    c.fillText(opt.label, w.x-18, y+9); c.textAlign='left'; }
  if (opt.value){ c.fillStyle=C.txt; c.font='26px system-ui'; c.fillText(opt.value, w.x+w.w+18, y+9); }
}
function panelBG(c, w, h){
  c.clearRect(0,0,w,h);
  c.fillStyle = C.bg; rr(c,0,0,w,h,28); c.fill();
  c.strokeStyle = C.line; c.lineWidth = 2; c.stroke();
}

/* ============================ playback bar ============================ */
const BAR_W = 1536;
const BAR = [
  {id:'back',  type:'btn', x:34,  y:26,  w:110, h:84},
  {id:'play',  type:'btn', x:158, y:26,  w:110, h:84},
  {id:'seek',  type:'slider', x:60, y:132, w:1416, h:74,
     get:()=> video && video.duration ? video.currentTime/video.duration : 0,
     set:v => { if (video && video.duration) video.currentTime = v*video.duration; }},
  {id:'vvol',  type:'slider', x:190, y:236, w:330, h:64,
     get:()=>videoVol, set:v=>{ videoVol=v; if(video) video.volume=v;
       localStorage.setItem('videoVol', v); }},
  {id:'cvol',  type:'slider', x:700, y:236, w:330, h:64,
     get:()=>chatVol, set:v=>{ chatVol=v; replyAudio.volume=v;
       localStorage.setItem('chatVol', v); }},
  {id:'ctr',   type:'btn', x:1036, y:230, w:58,  h:80},
  {id:'lib',   type:'btn', x:1100, y:230, w:110, h:80},
  {id:'mic',   type:'btn', x:1224, y:230, w:130, h:80},
  {id:'gear',  type:'btn', x:1368, y:230, w:66,  h:80},
  {id:'adv',   type:'btn', x:1444, y:230, w:66,  h:80},
];
function drawBar(p){
  const c = p.ctx, W = p.cv.width, H = p.cv.height;
  panelBG(c, W, H);
  const hov = id => p.hover === id;
  btn(c, BAR[0], '⟲', {hover:hov('back')});
  btn(c, BAR[1], video && !video.paused ? '❚❚' : '▶', {hover:hov('play')});
  const t = video ? video.currentTime : 0, d = (video && video.duration) || (detail && detail.videoLength) || 0;
  c.fillStyle = C.txt; c.font = '34px system-ui';
  c.fillText(`${fmt(t)} / ${fmt(d)}`, 296, 82);
  c.fillStyle = C.dim; c.font = '30px system-ui'; c.textAlign = 'right';
  c.fillText(clock(), W-40, 82);
  c.textAlign = 'left';
  if (detail){ c.fillStyle = C.dim; c.font='26px system-ui';
    let ti = detail.title || ''; if (ti.length > 44) ti = ti.slice(0,43)+'…';
    c.fillText(ti, 640, 80); }
  slider(c, BAR[2], BAR[2].get(), {hover:hov('seek')});
  slider(c, BAR[3], videoVol, {hover:hov('vvol'), label:'🔊 video', value:Math.round(videoVol*100)+'%'});
  slider(c, BAR[4], chatVol,  {hover:hov('cvol'), label:'💬 chat',  value:Math.round(chatVol*100)+'%'});
  btn(c, BAR[5], '⌖', {hover:hov('ctr')});
  btn(c, BAR[6], '☰', {hover:hov('lib')});
  btn(c, BAR[7], listening ? '● LIVE' : '🎤', {on:listening, hover:hov('mic'), font: listening?'26px':'30px'});
  // progressive disclosure: the advanced panel only exists once ADV is on
  if (advMode) btn(c, BAR[8], '⚙', {on:panels.adv && panels.adv.holder.visible, hover:hov('gear')});
  btn(c, BAR[9], 'ADV', {on:advMode, hover:hov('adv'), font:'22px'});
  if (centerAt){
    const left = Math.max(0, Math.ceil((centerAt - performance.now())/1000));
    c.fillStyle = C.accent; c.font='30px system-ui';
    c.fillText('look where you want it, recentering in ' + left + '…', 60, 330);
  }
  else if (performance.now() < noteUntil){ c.fillStyle=C.ok; c.font='28px system-ui'; c.fillText(saveNote, 296, 122); }
  if (voiceStatus){ c.fillStyle = listening ? C.rec : C.ok; c.font='26px system-ui';
    let s = voiceStatus; if (s.length>70) s = s.slice(0,69)+'…';
    c.fillText(s, 60, 330); }
  else if (voiceReply){ c.fillStyle=C.dim; c.font='26px system-ui';
    let s = 'Mariko: ' + voiceReply; if (s.length>70) s = s.slice(0,69)+'…';
    c.fillText(s, 60, 330); }
  p.tex.needsUpdate = true;
}

/* ============================ browse screen ============================ */
const LIB_CW = 1600;
const LIBW = [];
{
  const KEYS='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'.split('');
  KEYS.forEach((k,i)=>LIBW.push({id:'k_'+k, type:'btn', key:k,
    x: 60 + (i%18)*64, y: 120 + Math.floor(i/18)*68, w:56, h:60}));
  LIBW.push({id:'k_space', type:'btn', key:' ', x:60,  y:256, w:180, h:60});
  LIBW.push({id:'k_back',  type:'btn', x:252, y:256, w:150, h:60});
  LIBW.push({id:'k_clear', type:'btn', x:414, y:256, w:150, h:60});
  LIBW.push({id:'close',   type:'btn', x:1400, y:36, w:150, h:64});
  LIBW.push({id:'s_title', type:'btn', sort:'title', x:1000, y:256, w:150, h:60});
  LIBW.push({id:'s_long',  type:'btn', sort:'long',  x:1162, y:256, w:180, h:60});
  LIBW.push({id:'s_short', type:'btn', sort:'short', x:1354, y:256, w:196, h:60});
  const gx=60, gy=350, cw=368, chh=250, gap=14;
  for (let r=0;r<LIB_ROWS;r++) for (let col=0;col<LIB_COLS;col++){
    LIBW.push({id:`cell_${r*LIB_COLS+col}`, type:'btn', cell:r*LIB_COLS+col,
      x: gx+col*(cw+gap), y: gy+r*(chh+gap), w:cw, h:chh});
  }
  LIBW.push({id:'pg_prev', type:'btn', x:60,  y:1140, w:160, h:64});
  LIBW.push({id:'pg_next', type:'btn', x:232, y:1140, w:160, h:64});
}
function drawBrowse(p){
  const c = p.ctx, W = p.cv.width, H = p.cv.height;
  panelBG(c, W, H);
  const hov = id => p.hover === id;
  c.fillStyle = C.txt; c.font = '40px system-ui';
  c.fillText('Library', 60, 74);
  c.fillStyle = C.accent; c.font = '34px system-ui';
  c.fillText(libQuery ? '“'+libQuery+'”' : 'type to search', 260, 74);
  c.fillStyle = C.dim; c.font = '28px system-ui';
  c.fillText(`${libFiltered.length} of ${library.length}`, 1120, 74);
  btn(c, LIBW.find(w=>w.id==='close'), 'close', {hover:hov('close')});
  for (const w of LIBW){
    if (w.key) btn(c, w, w.key===' '?'space':w.key, {hover:hov(w.id), font:'28px', radius:10});
    else if (w.id==='k_back')  btn(c, w, 'del',   {hover:hov(w.id), font:'26px', radius:10});

/* ============================ voice ============================ */
const replyAudio = new Audio();
let micStream=null, micRec=null, micChunks=[], voiceBusy=false;
let listening=false, vadCtx=null, vadAnalyser=null, vadData=null;
let vadSpeaking=false, vadQuiet=0, vadArmed=false;
let voiceStatus='', voiceReply='';
let playQueue=[], playing=false;

const VAD = {on:0.030, off:0.018, hangMs:850, minMs:350};
let speechStart=0;

function duck(on){ if (video) video.volume = videoVol * (on ? 0.25 : 1); }

function enqueue(b64, text){ playQueue.push({b64,text}); if (!playing) playNext(); }
function playNext(){
  const it = playQueue.shift();
  if (!it){ playing=false; duck(false); voiceStatus = listening ? 'listening…' : '';
            vadArmed = listening; needDraw=true; return; }
  playing=true; duck(true);
  voiceReply = it.text; voiceStatus=''; needDraw=true;
  replyAudio.volume = chatVol;
  replyAudio.src = 'data:audio/wav;base64,' + it.b64;
  replyAudio.onended = playNext; replyAudio.onerror = playNext;
  replyAudio.play().catch(()=>{ voiceStatus='tap 🎤 to allow audio'; playing=false; duck(false); needDraw=true; });
}
async function ensureMic(){
  if (micStream) return micStream;
  micStream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}});
  vadCtx = new (window.AudioContext||window.webkitAudioContext)();
  const src = vadCtx.createMediaStreamSource(micStream);
  vadAnalyser = vadCtx.createAnalyser();
  vadAnalyser.fftSize = 1024;
  src.connect(vadAnalyser);
  vadData = new Float32Array(vadAnalyser.fftSize);
  return micStream;
}
function recStart(){
  micChunks=[];
  const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus'
             : (MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '');
  micRec = mime ? new MediaRecorder(micStream,{mimeType:mime}) : new MediaRecorder(micStream);
  micRec.ondataavailable = e => { if (e.data.size) micChunks.push(e.data); };
  micRec.onstop = sendVoice;
  micRec.start();
}
function recStop(){ try { micRec && micRec.state!=='inactive' && micRec.stop(); } catch(e){} }

async function toggleListen(){
  if (listening){
    listening=false; vadArmed=false; vadSpeaking=false;
    recStop(); voiceStatus=''; needDraw=true; return;
  }
  try {
    await ensureMic();
    if (vadCtx.state === 'suspended') await vadCtx.resume();
    listening=true; vadArmed=true; vadSpeaking=false;
    voiceStatus='listening…'; needDraw=true;
  } catch(e){ voiceStatus = 'mic blocked: ' + (e.message||e); needDraw=true; }
}
function pollVAD(){
  if (!listening || !vadAnalyser) return;
  // barge-in: talking while she speaks cancels playback
  vadAnalyser.getFloatTimeDomainData(vadData);
  let sum=0; for (let i=0;i<vadData.length;i++) sum += vadData[i]*vadData[i];
  const rms = Math.sqrt(sum/vadData.length);
  const now = performance.now();
  if (!vadArmed){
    if (playing && rms > VAD.on*1.6){          // barge-in
      playQueue=[]; try{ replyAudio.pause(); }catch(e){}
      playing=false; duck(false); vadArmed=true;
    } else return;
  }
  if (voiceBusy) return;
  if (!vadSpeaking){
    if (rms > VAD.on){ vadSpeaking=true; speechStart=now; vadQuiet=0;
      recStart(); voiceStatus='listening…'; needDraw=true; }
  } else {
    if (rms < VAD.off){
      if (!vadQuiet) vadQuiet = now;
      else if (now - vadQuiet > VAD.hangMs){
        vadSpeaking=false;
        if (now - speechStart < VAD.minMs){ micChunks=[]; recStop(); }
        else { vadArmed=false; recStop(); }
      }
    } else vadQuiet = 0;
  }
}
async function sendVoice(){
  const blob = new Blob(micChunks, {type:(micRec && micRec.mimeType)||'audio/webm'});
  micChunks=[];
  if (blob.size < 2500){ vadArmed = listening; voiceStatus = listening?'listening…':''; needDraw=true; return; }
  voiceBusy=true; voiceStatus='thinking…'; needDraw=true;
  playQueue=[]; playing=false;
  try {
    // a video can bind its own voice via the "voice" sidecar key
    const vq = (detail && detail.voice) ? '&voice='+encodeURIComponent(detail.voice) : '';
    const r = await fetch('/voice/talk?sid='+SID+vq, {method:'POST', body:blob,
      headers:{'Content-Type': blob.type||'audio/webm'}});
    const j = await r.json();
    if (!j.audio){ voiceStatus = j.error ? ('error: '+j.error) : (j.note||'nothing heard'); }
    else {
      voiceStatus='';
      enqueue(j.audio, j.reply||'');
      if (j.more && j.job) (async()=>{
        for (let n=1;n<32;n++){
          try {
            const cj = await (await fetch(`/voice/chunk?job=${j.job}&n=${n}`)).json();
            if (!cj.audio) break;
            enqueue(cj.audio, cj.text||'');
            if (!cj.more) break;
          } catch(e){ break; }
        }
      })();
    }
  } catch(e){ voiceStatus='voice failed: '+(e.message||e); }
  voiceBusy=false;
  if (listening && !playing) vadArmed = true;
  needDraw=true;
}
async function saveSidecar(){
  const body = {chroma:{color:keyState.color, similarity:keyState.similarity, smoothness:keyState.smoothness}};
  const r = await fetch('/sidecar/'+vidId, {method:'POST', body:JSON.stringify(body)});
  saveNote = r.ok ? 'saved' : 'save failed'; noteUntil = performance.now()+2500; needDraw=true;
}

/* ============================ lasers + hit test ============================ */
const raycaster = new THREE.Raycaster();
const tmpM = new THREE.Matrix4();
let lasers = {}, ctrls = {};
function makeLaser(){
  const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0,0,-1)]);
  const line = new THREE.Line(g, new THREE.LineBasicMaterial({
    color:0xffffff, transparent:true, opacity:0.35, depthTest:false}));
  line.renderOrder = 20;
  // ring cursor sits flush on the panel at the collision point
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.006, 0.011, 24),
    new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:0.95,
      depthTest:false, side:THREE.DoubleSide}));
  ring.renderOrder = 21; ring.visible = false;
  const dot = new THREE.Mesh(new THREE.CircleGeometry(0.0035, 20),
    new THREE.MeshBasicMaterial({color:0xffffff, depthTest:false}));
  dot.renderOrder = 22; dot.visible = false;
  return {line, ring, dot};
}
function activePanels(){
  const out = [];
  if (!menuOn) return out;
  if (screenMode === 'browse') out.push(panels.browse);
  else {
    out.push(panels.bar);
    if (panels.adv && panels.adv.holder.visible) out.push(panels.adv);
  }
  return out.filter(p => p && p.mesh);
}
function rayFrom(ctrl){
  tmpM.identity().extractRotation(ctrl.matrixWorld);
  raycaster.ray.origin.setFromMatrixPosition(ctrl.matrixWorld);
  raycaster.ray.direction.set(0,0,-1).applyMatrix4(tmpM);
  return raycaster;
}
function hitUI(ctrl){
  const ps = activePanels();
  if (!ps.length) return null;
  const hits = rayFrom(ctrl).intersectObjects(ps.map(p=>p.mesh), false);
  if (!hits.length) return null;
  const h = hits[0];
  const p = ps.find(x => x.mesh === h.object);
  const cx = h.uv.x * p.cv.width, cy = (1-h.uv.y) * p.cv.height;
  let widget = null;
  for (const w of p.widgets){
    if (cx>=w.x-10 && cx<=w.x+w.w+10 && cy>=w.y-10 && cy<=w.y+w.h+10){ widget=w; break; }
  }
  return {panel:p, widget, cx, cy, point:h.point, normal:h.face && h.face.normal, distance:h.distance};
}

/* ============================ actions ============================ */
function widgetClick(p, w){
  needDraw = true;
  if (w.key !== undefined){ libQuery += w.key; libApply(); return; }
  if (w.sort){ libSort = w.sort; localStorage.setItem('libSort', libSort); libApply(); return; }
  if (w.cell !== undefined){
    const item = libFiltered[libPage*LIB_PER + w.cell];
    if (item) playVideo(item.id);            // straight to playback, no detail page
    return;
  }
  switch(w.id){
    case 'play': video && (video.paused? video.play() : video.pause()); break;
    case 'back': screenMode='browse'; syncScreens(); break;
    case 'close': screenMode='bar'; syncScreens(); break;
    case 'ctr':  centerAt = performance.now() + 3000; break;
    case 'lib':  screenMode='browse'; syncScreens(); break;
    case 'mic':  toggleListen(); break;
    case 'gear': if (advMode) panels.adv.holder.visible = !panels.adv.holder.visible; break;
    case 'adv':
      advMode = !advMode; localStorage.setItem('advMode', advMode?'1':'0');
      if (!advMode) panels.adv.holder.visible = false;   // leaving ADV closes it
      break;
    case 'k_back': libQuery = libQuery.slice(0,-1); libApply(); break;
    case 'k_clear': libQuery=''; libApply(); break;
    case 'pg_prev': libPage = Math.max(0, libPage-1); break;
    case 'pg_next': libPage = Math.min(Math.max(0,Math.ceil(libFiltered.length/LIB_PER)-1), libPage+1); break;
    case 'keyblack': keyState.color='#000000'; applyKey(); break;
    case 'keygreen': keyState.color='#00ff00'; applyKey(); break;
    case 'reset': yaw=0;pitch=0;roll=0;posY=0;dist=0;scl=1; applyTransform(); break;
    case 'save': saveSidecar(); break;
  }
}
function syncScreens(){
  panelVisible('bar', screenMode==='bar');
  panelVisible('browse', screenMode==='browse');
  if (screenMode==='browse') panels.adv.holder.visible = false;
  needDraw = true;
}
async function playVideo(id){
  const prev = detail;
  vidId = id;
  detail = await (await fetch('/video/'+id)).json();
  const ch = detail.chroma || {};
  keyState.color = ch.color || '#000000';
  keyState.similarity = ch.similarity ?? 0.10;
  keyState.smoothness = ch.smoothness ?? 0.08;
  video.src = detail.encodings[0].videoSources[0].url;
  video.volume = videoVol;
  video.play().catch(()=>{});
  const changed = !prev || prev.screenType!==detail.screenType
    || prev.stereoMode!==detail.stereoMode || prev.alphaPack!==detail.alphaPack;
  if (changed) rebuildScreen();
  applyKey();
  screenMode='bar'; syncScreens();
}
function rebuildScreen(){
  if (!group || !videoTex) return;
  const tex = videoTex;          // module-scoped: mats is empty on first build
  for (const ch of group.children.slice()) group.remove(ch);
  mats = [];
  const st = detail.screenType || 'fisheye190';
  const sbs = (detail.stereoMode||'sbs')==='sbs';
  const matteTB = detail.alphaPack === 'tb';
  const geo = FOV[st] ? fisheyeGeo(FOV[st]) : domeGeo(st==='sphere');
  if (sbs && detail.is3d !== false){
    for (const eye of [0,1]){
      const m = makeMat(tex); eyeUV(m, eye, true, matteTB);
      const mesh = new THREE.Mesh(geo, m); mesh.layers.set(eye+1);
      group.add(mesh); mats.push(m);
    }
  } else {
    const m = makeMat(tex); eyeUV(m, 0, false, matteTB);
    group.add(new THREE.Mesh(geo, m)); mats.push(m);
  }
}

/* ============================ UI build / rebuild ============================ */
function buildUI(){
  uiRoot = new THREE.Group();
  uiRoot.rotation.order = 'YXZ';
  makePanel('bar',    {dist:UI.barDist, wDeg:UI.barWdeg, hDeg:UI.barHdeg, pitch:UI.barPitch,
                       cw:BAR_W, widgets:BAR, draw:drawBar, order:10});
  makePanel('browse', {dist:UI.libDist, wDeg:UI.libWdeg, hDeg:UI.libHdeg, pitch:UI.libPitch,
                       cw:LIB_CW, widgets:LIBW, draw:drawBrowse, order:10});
  makePanel('adv',    {dist:UI.advDist, wDeg:UI.advWdeg, hDeg:UI.advHdeg, pitch:UI.advPitch,
                       cw:ADV_CW, widgets:ADVW, draw:drawAdv, order:12});
  panels.adv.holder.rotation.y = rad(26);       // sits to the right of the bar
  panels.adv.holder.visible = false;
  for (const k in panels) uiRoot.add(panels[k].holder);

function rebuildUI(){
  if (!uiRoot) return;
  const advVis = panels.adv.holder.visible;
  const yawKeep = uiRoot.rotation.y, posKeep = uiRoot.position.clone();
  scene.remove(uiRoot);
  panels = {};
  buildUI();
  uiRoot.rotation.y = yawKeep; uiRoot.position.copy(posKeep);
  panels.adv.holder.visible = advVis;
  needDraw = true;
}
function anchorUI(){
  if (!uiRoot || !xrCam) return;
  const p = new THREE.Vector3().setFromMatrixPosition(xrCam.matrixWorld);
  uiRoot.position.copy(p);
  const e = new THREE.Euler().setFromRotationMatrix(xrCam.matrixWorld, 'YXZ');
  uiRoot.rotation.y = e.y;
}

/* ============================ input ============================ */
let triggerDown={}, drag=null, aiming=null;
function onSelectStart(hand, ctrl){
  const hit = hitUI(ctrl);
  triggerDown[hand] = {t:performance.now(), overUI:!!hit};
  if (hit){
    if (hit.widget && hit.widget.type==='slider'){ drag={hand, w:hit.widget, panel:hit.panel}; dragTo(hit); }
    else if (hit.widget) widgetClick(hit.panel, hit.widget);
  }
}
function onSelectEnd(hand){
  const td = triggerDown[hand]; triggerDown[hand]=null;
  if (drag && drag.hand===hand){ drag=null; return; }
  if (aiming && aiming.hand===hand){ aiming=null; return; }
  if (td && !td.overUI && performance.now()-td.t < 320){
    menuOn = !menuOn;
    if (menuOn) anchorUI();
    needDraw = true;
  }
}
function dragTo(hit){
  if (!drag) return;
  drag.w.set(clamp((hit.cx - drag.w.x)/drag.w.w, 0, 1));
  needDraw = true;
}
function updatePointers(){
  for (const hand of ['left','right']){
    const l = lasers[hand], c = ctrls[hand];
    if (!l || !c) continue;
    const show = menuOn;
    l.line.visible = show;
    if (!show){ l.ring.visible=false; l.dot.visible=false; continue; }
    const hit = hitUI(c);
    const p = panels && hit ? hit.panel : null;
    // hover state
    for (const k in panels){
      const want = (p===panels[k]) ? (hit.widget ? hit.widget.id : null) : null;
      if (panels[k].hover !== want && (p===panels[k] || panels[k].hover!==null)){
        panels[k].hover = want; needDraw = true;
      }
    }
    if (hit){
      const d = hit.distance;
      l.line.scale.z = d;
      l.line.material.opacity = 0.75;
      l.ring.visible = true; l.dot.visible = true;
      l.ring.position.copy(hit.point); l.dot.position.copy(hit.point);
      // lie flat on the panel surface
      const n = hit.point.clone().sub(new THREE.Vector3().setFromMatrixPosition(hit.panel.mesh.matrixWorld));
      l.ring.lookAt(new THREE.Vector3().setFromMatrixPosition(xrCam.matrixWorld));
      l.dot.lookAt(new THREE.Vector3().setFromMatrixPosition(xrCam.matrixWorld));
    } else {
      l.line.scale.z = 2.2;
      l.line.material.opacity = 0.28;
      l.ring.visible = false; l.dot.visible = false;
    }
  }
  // hold trigger away from UI = re-aim the menu
  for (const hand of ['left','right']){
    const td = triggerDown[hand];
    if (td && !td.overUI && !drag && !aiming && performance.now()-td.t >= 320){
      aiming = {hand};
      if (!menuOn){ menuOn = true; needDraw = true; }
    }
  }
  if (aiming && ctrls[aiming.hand] && uiRoot && xrCam){
    const rc = rayFrom(ctrls[aiming.hand]);
    const camPos = new THREE.Vector3().setFromMatrixPosition(xrCam.matrixWorld);
    uiRoot.position.copy(camPos);
    const dir = rc.ray.direction.clone();
    uiRoot.rotation.y = Math.atan2(-dir.x, -dir.z);
    needDraw = true;
  }
  if (drag && ctrls[drag.hand]){
    const hits = rayFrom(ctrls[drag.hand]).intersectObject(drag.panel.mesh, false);
    if (hits.length) dragTo({cx: hits[0].uv.x*drag.panel.cv.width});
  }
}
function pollGamepads(dt, frame){
  if (!session) return;
  for (const src of session.inputSources){
    const gp = src.gamepad; if (!gp) continue;
    const hand = src.handedness; if (hand!=='left' && hand!=='right') continue;
    const ax = gp.axes.length>=4 ? [gp.axes[2],gp.axes[3]] : [gp.axes[0]||0, gp.axes[1]||0];
    const dead = v => Math.abs(v)<0.15?0:v;
    const sx=dead(ax[0]), sy=dead(ax[1]);
    const prev=prevBtn[hand];
    const pressed=i=>!!(gp.buttons[i]&&gp.buttons[i].pressed);
    const edge=i=>{const n=pressed(i),w=!!prev[i];prev[i]=n;return n&&!w;};
    const grip=pressed(1);
    if (hand==='right'){
      if (edge(4)){ video && (video.paused?video.play():video.pause()); needDraw=true; }
      if (edge(5)) session.end();
      if (edge(3)){ menuOn=!menuOn; if(menuOn) anchorUI(); needDraw=true; }
      {
        if (grip && src.gripSpace && frame){
          const pose = frame.getPose(src.gripSpace, renderer.xr.getReferenceSpace());
          if (pose){
            const o=pose.transform.orientation, pp=pose.transform.position;
            const q=new THREE.Quaternion(o.x,o.y,o.z,o.w);
            const fwd=new THREE.Vector3(0,0,-1).applyQuaternion(q);
            const yawC=Math.atan2(-fwd.x,-fwd.z), pitchC=Math.asin(clamp(fwd.y,-1,1));
            if (!grab) grab={yawC,pitchC,py:pp.y,yaw0:yaw,pitch0:pitch,posY0:posY};
            let d=yawC-grab.yawC; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI;
            yaw = grab.yaw0 - d;
            pitch = clamp(grab.pitch0 - (pitchC-grab.pitchC), -1.3, 1.3);
            posY = grab.posY0 + (pp.y-grab.py)*1.5;
            applyTransform();
          }
          if (sy){ scl=clamp(scl*(1-sy*dt*0.8),0.3,3); applyTransform(); }
        } else grab=null;
      } else grab=null;
    } else {
      if (advMode){
        if (sy){ if (grip) dist=clamp(dist-sy*dt*1.6,-3,3); else scl=clamp(scl*(1-sy*dt*0.8),0.3,3); applyTransform(); }
        if (sx && performance.now()>seekCool && Math.abs(sx)>0.6 && video && video.duration){
          video.currentTime = clamp(video.currentTime+(sx>0?10:-10),0,video.duration);
          seekCool = performance.now()+400; needDraw=true;
        }
        if (edge(5)){ yaw=0;pitch=0;posY=0;dist=0;scl=1; applyTransform();
                      recenter(lastFrame); needDraw=true; }
      }
      if (edge(4)) toggleListen();
    }
  }
}

/* ============================ session ============================ */
// Two steps on purpose. requestSession() only works while the browser still
// sees a live user gesture, and awaiting the mic prompt / metadata fetch first
// consumes it -- which silently dropped the session and left the audio running.
// So: prepare here, then let the Enter VR click own the session request.
let starting = false, pending = null, selectedId = null;
let frameCount = 0, hbTimer = null, cam = null, glCanvas = null;
// Reference-space forward is the runtime's, not your gaze, so content must be
// aligned to the real head heading rather than assumed to face -Z.
let baseYaw = 0, centered = false, lastFrame = null, centerAt = 0;
function headPose(frame){
  if (!frame || !renderer) return null;
  try { return frame.getViewerPose(renderer.xr.getReferenceSpace()); }
  catch(e){ return null; }
}
function poseYaw(pose){
  const o = pose.transform.orientation;
  const q = new THREE.Quaternion(o.x, o.y, o.z, o.w);
  const f = new THREE.Vector3(0,0,-1).applyQuaternion(q);
  return Math.atan2(-f.x, -f.z);
}
function recenter(frame){
  const pose = headPose(frame);
  if (!pose) return false;
  baseYaw = poseYaw(pose);
  applyTransform();
  if (uiRoot){
    const p = pose.transform.position;
    uiRoot.position.set(p.x, p.y, p.z);
    uiRoot.rotation.y = baseYaw;
  }
  needDraw = true;
  return true;
}

// The renderer is built once at page load, never inside an entry attempt.
// Creating a GL context while a session is granted but not yet attached
// crashed the tab; every three.js XR example builds the renderer first.
function initGL(){
  if (renderer) return true;
  try {
    glCanvas = document.createElement('canvas');
    const gl = glCanvas.getContext('webgl2', {
      xrCompatible:true, alpha:true, antialias:false,
      depth:true, stencil:false, powerPreference:'high-performance'});
    if (!gl) throw new Error('no webgl2');
    glCanvas.addEventListener('webglcontextlost',
      e => { e.preventDefault(); beacon('WEBGL CONTEXT LOST'); }, false);
    renderer = new THREE.WebGLRenderer({canvas:glCanvas, context:gl,
      alpha:true, antialias:false});
    renderer.setPixelRatio(1);
    renderer.setSize(innerWidth, innerHeight);
    renderer.xr.enabled = true;
    renderer.domElement.className = 'gl';
    document.body.appendChild(renderer.domElement);
    beacon('GL ready at load');
    return true;
  } catch(e){ report('initGL', e); renderer = null; return false; }
}
async function select(id){
  if (starting || session) return;
  // Set this synchronously. Enter VR only needs the id; metadata is a bonus,
  // and start() can fetch it itself once the session is already secured.
  selectedId = id; pending = null;
  $('err').textContent = ''; $('err2').textContent = '';
  const item = library.find(v => v.id === id) || {};
  $('sthumb').src = '/thumb/'+id+'.jpg';
  $('stitle').textContent = item.title || '';
  $('smeta').textContent = 'ready — tap Enter VR';
  $('stage').hidden = false;
  diag();
  // permission prompt must happen out here: it cannot be shown once immersed
  ensureMic().catch(() => { voiceStatus = 'mic not allowed'; });
  try {
    const d = await (await fetch('/video/'+id)).json();
    pending = {id, detail:d};
    $('smeta').textContent = `${d.screenType} · ${d.stereoMode} · ${fmt(d.videoLength||0)}`
      + (d.voice ? ` · voice: ${d.voice}` : '');
  } catch(e){
    $('smeta').textContent = 'metadata unavailable — Enter VR will retry';
  }
}
async function diag(){
  const bits = [];
  bits.push(location.protocol === 'https:' ? 'https ✓' : 'NOT https ✗');
  bits.push(navigator.xr ? 'WebXR ✓' : 'no navigator.xr ✗');
  if (navigator.xr){
    try { bits.push((await navigator.xr.isSessionSupported('immersive-ar'))
      ? 'immersive-ar ✓' : 'immersive-ar UNSUPPORTED ✗'); }
    catch(e){ bits.push('support check failed'); }
  }
  $('sdiag').textContent = bits.join('  ·  ');
}
$('go').onclick = async () => {
  if (starting || session) return;
  if (!selectedId){ $('err2').textContent = 'no video selected'; return; }
  starting = true; $('err2').textContent = 'requesting session…';
  try {
    await start(selectedId, pending && pending.detail);
    $('err2').textContent = '';
  } catch(e){
    $('err2').textContent = 'failed: ' + (e && (e.name ? e.name+': ' : '') + (e.message||e) || e);
    cleanup();
  }
  starting = false;
};
$('cancel') && ($('cancel').onclick = () => { pending=null; selectedId=null; $('stage').hidden = true; });

async function start(id, pre){
  step('A go-clicked');
  if (!navigator.xr) throw new Error('WebXR unavailable — open the https URL');
  // FIRST, while the click is still live: everything else can wait.
  const xrs = await navigator.xr.requestSession('immersive-ar');
  step('B session-granted');

  vidId = id;
  detail = pre || await (await fetch('/video/'+id)).json();
  step('C detail ' + detail.screenType + ' ' + detail.stereoMode);
  const ch = detail.chroma || {};
  keyState.color = ch.color || '#000000';
  keyState.similarity = ch.similarity ?? 0.10;
  keyState.smoothness = ch.smoothness ?? 0.08;

  if (video){ try{ video.pause(); video.src=''; }catch(e){} }
  video = document.createElement('video');
  video.loop = true; video.playsInline = true; video.volume = videoVol;
  video.preload = 'metadata';
  video.src = detail.encodings[0].videoSources[0].url;
  // Load dimensions but do NOT start decoding yet: playback begins once the
  // session and GL context are established, so the two never contend.
  await new Promise(res => {
    if (video.readyState >= 1) return res();
    video.addEventListener('loadedmetadata', res, {once:true});
    video.addEventListener('error', res, {once:true});
    setTimeout(res, 8000);
  });
  step('D metadata ' + video.videoWidth + 'x' + video.videoHeight);
  replyAudio.volume = chatVol;
  // Never await this. play() on an element with no src returns a promise that
  // Chromium never settles, which hung start() here and stopped the session
  // from ever being attached. Prime it fire-and-forget with a silent source.
  try {
    replyAudio.muted = true;
    replyAudio.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAgD4A'
                   + 'AAB9AAACABAAZGF0YQAAAAA=';
    const p = replyAudio.play();
    if (p && p.catch) p.catch(()=>{});
    setTimeout(() => { try { replyAudio.pause(); replyAudio.muted = false; } catch(e){} }, 0);
  } catch(e){ replyAudio.muted = false; }

  if (!renderer && !initGL()) throw new Error('WebGL unavailable');
  // fresh scene per session; the renderer and its GL context persist
  scene = new THREE.Scene();
  cam = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.03, 100);
  cam.layers.enable(1);

  step('E renderer-ready');
  videoTex = new THREE.VideoTexture(video);
  videoTex.colorSpace = THREE.SRGBColorSpace; videoTex.minFilter = THREE.LinearFilter;
  group = new THREE.Group(); scene.add(group);
  mats=[]; yaw=0;pitch=0;posY=0;dist=0;scl=1; grab=null;
  rebuildScreen(); applyKey();
  step('F screen-built mats=' + mats.length);

  buildUI();
  step('G ui-built ' + Object.keys(panels).join(','));

  for (const i of [0,1]){
    const c = renderer.xr.getController(i);
    c.addEventListener('connected', e => {
      c.userData.hand = e.data.handedness;
      ctrls[e.data.handedness] = c;
      const l = makeLaser();
      c.add(l.line); scene.add(l.ring); scene.add(l.dot);
      lasers[e.data.handedness] = l;
    });
    c.addEventListener('disconnected', () => { if (c.userData.hand) delete ctrls[c.userData.hand]; });
    c.addEventListener('selectstart', () => c.userData.hand && onSelectStart(c.userData.hand, c));
    c.addEventListener('selectend',   () => c.userData.hand && onSelectEnd(c.userData.hand));
    scene.add(c);
  }

  step('H controllers-added');
  session = xrs;
  session.addEventListener('end', cleanup);
  renderer.xr.setReferenceSpaceType('local');
  await renderer.xr.setSession(session);
  step('I setSession-ok');
  await video.play().catch(e => report('video.play', e));
  step('I2 playing');
  $('stage').hidden = true; $('lib').hidden = true; pending = null;

  let last=performance.now(), tick=0, anchored=false;
  // Each stage is isolated: a fault in input or UI drawing must not stop the
  // scene rendering, or the session looks completely dead.
  const guard = (tag, fn) => { try { fn(); } catch(e){ report(tag, e); } };
  renderer.setAnimationLoop((t, frame) => {
    frameCount++; lastFrame = frame;
    const now=performance.now(), dt=Math.min(0.1,(now-last)/1000); last=now;
    try { xrCam = renderer.xr.getCamera(); } catch(e){ report('getCamera', e); }
    // Align to the real head heading once a viewer pose exists. On frame 1 the
    // XR camera matrix is still identity, which is what put everything 90 deg
    // off to one side.
    if (centerAt){
      if (now >= centerAt){ centerAt = 0; guard('recenter', () => recenter(frame)); }
      needDraw = true;
    }
    if (!centered) guard('recenter', () => {
      if (recenter(frame)){ centered = true; beacon('CENTERED yaw=' + (baseYaw*57.3).toFixed(0)); }
    });
    guard('pollGamepads', () => pollGamepads(dt, frame));
    guard('pollVAD', pollVAD);
    guard('updatePointers', updatePointers);
    if (menuOn && (needDraw || now > tick)){
      guard('draw', () => {
        for (const k in panels) if (panels[k] && panels[k].holder.visible) panels[k].draw(panels[k]);
      });
      needDraw=false; tick = now + 250;
    }
    try { renderer.render(scene, cam); } catch(e){ report('render', e); }
  });
  step('J loop-installed');
  // Heartbeat proves whether the loop is really running, and for how long,
  // which separates "never started" from "started then died".
  hbTimer = setInterval(() => {
    if (!session){ clearInterval(hbTimer); hbTimer=null; return; }
    beacon('HEARTBEAT frames=' + frameCount);
  }, 5000);
}
function cleanup(){
  try{ hbTimer && clearInterval(hbTimer); }catch(e){} hbTimer=null;
  try{ renderer && renderer.setAnimationLoop(null); }catch(e){}
  try{ const p = session && session.end(); if (p && p.catch) p.catch(()=>{}); }catch(e){}
  // keep the renderer and its GL context alive for the next session
  // release the media element, or its audio keeps playing after exit
  try{ video && video.pause(); video && (video.src=''); video && video.load(); }catch(e){}
  try{ replyAudio.pause(); replyAudio.src=''; }catch(e){}
  try{ renderer && renderer.domElement.remove(); renderer.dispose(); }catch(e){}
  try{ recStop(); }catch(e){}
  try{ micStream && micStream.getTracks().forEach(t=>t.stop()); }catch(e){}
  try{ vadCtx && vadCtx.close(); }catch(e){}
  session=null; renderer=null; video=null; mats=[]; group=null; uiRoot=null;
  panels={}; lasers={}; ctrls={}; drag=null; aiming=null; triggerDown={};
  micStream=null; vadCtx=null; listening=false; playing=false; playQueue=[];
  prevBtn.left={}; prevBtn.right={};
  starting=false; pending=null; selectedId=null; videoTex=null;
  $('stage').hidden = true; $('lib').hidden = false;
}

initGL();     // build the GL context before any session is ever requested
loadLib();
</script>
</body>
</html>
